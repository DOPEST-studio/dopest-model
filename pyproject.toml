[project]
name = "dopest-model"
version = "0.1.0"
description = "DOPEST model: open Jev-style decision model"
authors = [
    { name = "Kacper Najda", email = "kacper@dopest.studio" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.3.0",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.4",
    "openai>=3.37.0",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = [
    "modal>=1.6.2",
    "pytest>=9.1.1",
]
